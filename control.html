<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Marcador - Liga Universitaria</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #111;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.panel {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin: 0 0 8px;
}

.partido {
  text-align: center;
  color: #aaa;
  font-size: 14px;
  margin-bottom: 20px;
}

.estado {
  text-align: center;
  padding: 10px;
  margin-bottom: 15px;
  border-radius: 8px;
  background: #1d1d1d;
  color: #aaa;
}

.marcador {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 15px;
}

.equipo {
  background: #1d1d1d;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.equipo-nombre {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 8px;
}

.goles {
  font-size: 46px;
  font-weight: 900;
  margin-bottom: 10px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 13px;
  margin-bottom: 8px;
  background: #292929;
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.seccion {
  background: #1d1d1d;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.seccion-titulo {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 10px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.fila {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.danger {
  background: #492020;
}

</style>
</head>

<body>

<div class="panel">

  <h1>CONTROL DEL MARCADOR</h1>

  <div id="partido" class="partido">
    Partido 1
  </div>

  <div id="estado" class="estado">
    Conectando con Firebase...
  </div>


  <div class="marcador">

    <div class="equipo">

      <div id="homeName" class="equipo-nombre">
        EQUIPO LOCAL
      </div>

      <div id="homeScore" class="goles">
        0
      </div>

      <button onclick="homeGoal()">
        + LOCAL
      </button>

    </div>


    <div class="equipo">

      <div id="awayName" class="equipo-nombre">
        EQUIPO VISITANTE
      </div>

      <div id="awayScore" class="goles">
        0
      </div>

      <button onclick="awayGoal()">
        + VISITANTE
      </button>

    </div>

  </div>


  <div class="seccion">

    <div class="seccion-titulo">
      Reloj
    </div>

    <div id="clock" class="goles">
      00:00
    </div>

    <div id="period" style="text-align:center; margin-bottom:10px;">
      1T
    </div>

    <div class="fila">

      <button onclick="startClock()">
        ▶ Iniciar
      </button>

      <button onclick="pauseClock()">
        ⏸ Pausar
      </button>

    </div>

  </div>


  <div class="seccion">

    <div class="seccion-titulo">
      Tiempo de juego
    </div>

    <div class="fila">

      <button onclick="finishFirstHalf()">
        Finalizar 1T
      </button>

      <button onclick="startSecondHalf()">
        Iniciar 2T
      </button>

    </div>

    <button onclick="finishMatch()">
      Finalizar partido
    </button>

  </div>


  <div class="seccion">

    <div class="seccion-titulo">
      Tiempo adicional
    </div>

    <div class="fila">

      <button onclick="showAddedTime(1)">
        +1
      </button>

      <button onclick="showAddedTime(2)">
        +2
      </button>

      <button onclick="showAddedTime(3)">
        +3
      </button>

      <button onclick="showAddedTime(4)">
        +4
      </button>

      <button onclick="showAddedTime(5)">
        +5
      </button>

      <button onclick="hideAddedTime()">
        Ocultar
      </button>

    </div>

  </div>


  <div class="seccion">

    <div class="seccion-titulo">
      Partido
    </div>

    <button class="danger" onclick="resetMatch()">
      ↺ Reiniciar partido
    </button>

  </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>


<script>

const firebaseConfig = {
  apiKey: "AIzaSyBZO-xr8s1iXC6RrSYYX3VSaqEs_1Vnj80",
  authDomain: "suenos-en-juego-marcador.firebaseapp.com",
  projectId: "suenos-en-juego-marcador",
  storageBucket: "suenos-en-juego-marcador.firebasestorage.app",
  messagingSenderId: "199445224003",
  appId: "1:199445224003:web:62102f321ceb14231d52f6",
  databaseURL: "https://suenos-en-juego-marcador-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();


const params =
  new URLSearchParams(window.location.search);

const partidoNumero =
  params.get("partido") || "1";

const matchRef =
  db.ref("matches/partido" + partidoNumero);


let home = 0;
let away = 0;
let seconds = 0;

let running = false;
let currentPeriod = "1T";
let addedTime = null;
let clockStartedAt = null;

let timer = null;
let loadingFirebase = true;


const homeScoreElement =
  document.getElementById("homeScore");

const awayScoreElement =
  document.getElementById("awayScore");

const homeNameElement =
  document.getElementById("homeName");

const awayNameElement =
  document.getElementById("awayName");

const clockElement =
  document.getElementById("clock");

const periodElement =
  document.getElementById("period");

const estadoElement =
  document.getElementById("estado");

const partidoElement =
  document.getElementById("partido");


/* =========================
   RELOJ
========================= */

function getCurrentSeconds() {

  if (!running || !clockStartedAt) {
    return seconds;
  }

  const elapsed =
    Math.floor(
      (Date.now() - clockStartedAt) / 1000
    );

  return seconds + Math.max(0, elapsed);
}


function updateClock() {

  const currentSeconds =
    getCurrentSeconds();

  const minutes =
    Math.floor(currentSeconds / 60);

  const secs =
    currentSeconds % 60;

  clockElement.textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");
}


function stopLocalTimer() {

  if (timer !== null) {

    clearInterval(timer);

    timer = null;
  }
}


function startLocalTimer() {

  stopLocalTimer();

  if (!running || !clockStartedAt) {
    return;
  }

  timer =
    setInterval(function() {

      updateClock();

    }, 250);
}


/* =========================
   MOSTRAR DATOS
========================= */

function updateScreen() {

  homeScoreElement.textContent =
    home;

  awayScoreElement.textContent =
    away;

  updateClock();

  periodElement.textContent =
    currentPeriod;

  if (currentPeriod === "ENTRETIEMPO") {

    estadoElement.textContent =
      "ENTRETIEMPO";

  } else if (currentPeriod === "FINAL") {

    estadoElement.textContent =
      "FINAL";

  } else if (running) {

    estadoElement.textContent =
      "RELOJ EN MARCHA";

  } else {

    estadoElement.textContent =
      "RELOJ PAUSADO";
  }
}


/* =========================
   GOLES
========================= */

function homeGoal() {

  if (loadingFirebase) {
    return;
  }

  matchRef
    .child("homeScore")
    .transaction(function(currentValue) {

      return (currentValue || 0) + 1;

    });
}


function awayGoal() {

  if (loadingFirebase) {
    return;
  }

  matchRef
    .child("awayScore")
    .transaction(function(currentValue) {

      return (currentValue || 0) + 1;

    });
}


/* =========================
   RELOJ
========================= */

function startClock() {

  if (loadingFirebase) {
    return;
  }

  if (running) {
    return;
  }

  if (
    currentPeriod === "ENTRETIEMPO" ||
    currentPeriod === "FINAL"
  ) {
    return;
  }


  running = true;

  clockStartedAt =
    Date.now();


  startLocalTimer();

  updateScreen();


  matchRef.update({

    running:
      true,

    seconds:
      seconds,

    clockStartedAt:
      firebase.database.ServerValue.TIMESTAMP

  });
}


function pauseClock() {

  if (loadingFirebase) {
    return;
  }

  if (!running) {
    return;
  }


  seconds =
    getCurrentSeconds();

  running = false;

  clockStartedAt = null;

  stopLocalTimer();

  updateScreen();


  matchRef.update({

    seconds:
      seconds,

    running:
      false,

    clockStartedAt:
      null

  });
}


/* =========================
   PRIMER TIEMPO
========================= */

function finishFirstHalf() {

  if (loadingFirebase) {
    return;
  }


  if (running) {

    seconds =
      getCurrentSeconds();
  }


  running = false;

  clockStartedAt = null;

  stopLocalTimer();

  currentPeriod =
    "ENTRETIEMPO";


  updateScreen();


  matchRef.update({

    seconds:
      seconds,

    running:
      false,

    clockStartedAt:
      null,

    period:
      "ENTRETIEMPO"

  });
}


/* =========================
   SEGUNDO TIEMPO
========================= */

function startSecondHalf() {

  if (loadingFirebase) {
    return;
  }


  stopLocalTimer();


  seconds =
    45 * 60;

  currentPeriod =
    "2T";

  addedTime =
    null;

  running =
    true;

  clockStartedAt =
    Date.now();


  updateScreen();

  startLocalTimer();


  matchRef.update({

    seconds:
      45 * 60,

    period:
      "2T",

    addedTime:
      null,

    running:
      true,

    clockStartedAt:
      firebase.database.ServerValue.TIMESTAMP

  });
}


/* =========================
   FINAL
========================= */

function finishMatch() {

  if (loadingFirebase) {
    return;
  }


  if (running) {

    seconds =
      getCurrentSeconds();
  }


  running = false;

  clockStartedAt = null;

  stopLocalTimer();

  currentPeriod =
    "FINAL";


  updateScreen();


  matchRef.update({

    seconds:
      seconds,

    running:
      false,

    clockStartedAt:
      null,

    period:
      "FINAL"

  });
}


/* =========================
   ADICIONAL
========================= */

function showAddedTime(minutes) {

  if (loadingFirebase) {
    return;
  }


  addedTime =
    minutes;


  matchRef.update({

    addedTime:
      minutes

  });
}


function hideAddedTime() {

  if (loadingFirebase) {
    return;
  }


  addedTime =
    null;


  matchRef.update({

    addedTime:
      null

  });
}


/* =========================
   REINICIAR
========================= */

function resetMatch() {

  if (loadingFirebase) {
    return;
  }


  stopLocalTimer();


  home = 0;
  away = 0;
  seconds = 0;

  running = false;

  currentPeriod =
    "1T";

  addedTime =
    null;

  clockStartedAt =
    null;


  updateScreen();


  matchRef.update({

    homeScore:
      0,

    awayScore:
      0,

    seconds:
      0,

    running:
      false,

    period:
      "1T",

    addedTime:
      null,

    clockStartedAt:
      null

  });
}


/* =========================
   FIREBASE
========================= */

auth.signInAnonymously()

  .then(function() {

    partidoElement.textContent =
      "Partido " + partidoNumero;


    matchRef.on(
      "value",
      function(snapshot) {

        const data =
          snapshot.val();


        if (!data) {

          loadingFirebase =
            false;

          updateScreen();

          return;
        }


        home =
          data.homeScore ?? 0;

        away =
          data.awayScore ?? 0;

        seconds =
          data.seconds ?? 0;

        running =
          data.running ?? false;

        currentPeriod =
          data.period ?? "1T";

        addedTime =
          data.addedTime ?? null;

        clockStartedAt =
          data.clockStartedAt ?? null;


        if (data.homeName) {

          homeNameElement.textContent =
            data.homeName;
        }


        if (data.awayName) {

          awayNameElement.textContent =
            data.awayName;
        }


        updateScreen();


        loadingFirebase =
          false;


        if (running) {

          startLocalTimer();

        } else {

          stopLocalTimer();

        }

      }
    );

  })

  .catch(function(error) {

    console.error(error);

    estadoElement.textContent =
      "Error al conectar con Firebase";

  });


/* =========================
   INICIO
========================= */

updateScreen();


window.homeGoal =
  homeGoal;

window.awayGoal =
  awayGoal;

window.startClock =
  startClock;

window.pauseClock =
  pauseClock;

window.finishFirstHalf =
  finishFirstHalf;

window.startSecondHalf =
  startSecondHalf;

window.finishMatch =
  finishMatch;

window.showAddedTime =
  showAddedTime;

window.hideAddedTime =
  hideAddedTime;

window.resetMatch =
  resetMatch;

</script>

</body>
  </html>
