<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcador Liga Universitaria</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
}

.scoreboard {
  position: relative;
  isolation: isolate;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  background: rgba(190, 160, 235, 0.96);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,0.35);
}

.scoreboard::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.28) 0%,
    rgba(255, 255, 255, 0.07) 35%,
    rgba(0, 0, 0, 0.00) 55%,
    rgba(0, 0, 0, 0.22) 100%
  );
  pointer-events: none;
  z-index: 10;
}

.league {
  text-align: center;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 2px;
  padding: 10px 20px;
  background: #368DBB;
  border-bottom: 1px solid #286C96;
}

.match {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 85px 220px 85px minmax(0, 1fr);
  align-items: stretch;
  min-height: 95px;
  padding: 0;
  gap: 0;
}

.team {
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 24px;
  font-weight: 800;
}

.team.home {
  justify-content: flex-end;
  text-align: right;
}

.team.away {
  justify-content: flex-start;
  text-align: left;
}

.team.home,
.team.away {
  background: transparent;
  padding: 5px 15px;
  gap: 12px;
  min-width: 0;
}

.home-score-panel,
.away-score-panel {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #080808;
  color: #fff;
  font-size: 58px;
  font-weight: 900;
  line-height: 1;
  min-width: 0;
}

.home-score-panel span,
.away-score-panel span {
  display: block;
}

.center {
  background: rgba(190, 160, 235, 0.96);
}

.crest {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #222;
  border: 2px solid #555;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 900;
  flex-shrink: 0;
  overflow: hidden;
}

.crest img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 50%;
}

.score {
  font-size: 58px;
  font-weight: 900;
  line-height: 1;
  min-width: 55px;
  text-align: center;
}

.fouls {
  display: none;
  width: fit-content;
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  background: rgba(0, 0, 0, 0.72);
  padding: 4px 8px;
  border-radius: 5px;
  margin-top: 6px;
  white-space: nowrap;
}

.team.home .fouls {
  margin-left: auto;
}

.team.away .fouls {
  margin-right: auto;
}

.center {
  text-align: center;
  position: relative;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.clock {
  font-size: 42px;
  font-weight: 900;
  line-height: 1;
  transition: opacity 0.25s, transform 0.25s;
}

.period {
  font-size: 17px;
  font-weight: 800;
  margin-top: 7px;
  letter-spacing: 1px;
}

.first-leg {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 4px;
  line-height: 1;
}

.first-leg-title {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 0.5px;
  color: #24163B;
}

.first-leg-score {
  font-size: 18px;
  font-weight: 900;
  margin-top: 0;
}

.penalties {
  display: none;
  width: 100%;
  min-height: 48px;
  padding: 7px 20px;
  background: #111;
  border-top: 1px solid #333;
  border-bottom: 1px solid #333;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 15px;
}

.penalty-team {
  display: flex;
  align-items: center;
  gap: 10px;
}

.home-penalty {
  justify-content: flex-end;
  text-align: right;
}

.away-penalty {
  justify-content: flex-start;
  text-align: left;
}

.penalty-score {
  font-size: 22px;
  font-weight: 900;
  min-width: 22px;
}

.penalty-results {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 2px;
  white-space: nowrap;
}

.penalty-center {
  text-align: center;
}

.penalty-title {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1.5px;
}

.halftime {
  display: none;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 1px;
}

.added-time {
  min-height: 24px;
  margin-top: 7px;
  font-size: 16px;
  font-weight: 800;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 15px;
  background: #151515;
  border-top: 1px solid #333;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 10px 13px;
  background: #292929;
  color: white;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

button:hover {
  background: #3b3b3b;
}

button:active {
  transform: scale(0.97);
}

.status {
  text-align: center;
  padding: 6px 10px;
  font-size: 12px;
  color: #aaa;
  background: #0d0d0d;
}

.controls,
.status {
  display: none;
}

@media (max-width: 800px) {

  .match {
    grid-template-columns: minmax(0, 1fr) 48px 110px 48px minmax(0, 1fr);
    padding: 0;
    gap: 0;
  }

  .team {
    font-size: 16px;
    gap: 8px;
  }

  .crest {
    width: 45px;
    height: 45px;
    font-size: 16px;
  }

  .score {
    font-size: 42px;
    min-width: 40px;
  }

  .fouls {
    font-size: 18px;
  }

  .clock {
    font-size: 32px;
  }

  .period {
    font-size: 14px;
  }

  .halftime {
    font-size: 16px;
  }

  .team.home,
  .team.away {
    padding: 5px 3px;
    gap: 4px;
    font-size: 12px;
  }

  .crest {
    width: 28px;
    height: 28px;
    font-size: 12px;
  }

  .fouls {
    font-size: 10px;
  }
}
</style>
</head>
