<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
}


.scoreboard {
  position: relative;
  isolation: isolate;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  background: rgba(190, 160, 235, 0.96);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,0.35);
}

.scoreboard::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
  to bottom,
  rgba(255, 255, 255, 0.28) 0%,
  rgba(255, 255, 255, 0.07) 35%,
  rgba(0, 0, 0, 0.00) 55%,
  rgba(0, 0, 0, 0.22) 100%
);
  pointer-events: none;
  z-index: 10;
}


.league {

  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  padding: 10px 20px;
  background: #368DBB;
border-bottom: 1px solid #286C96;
}

.match {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 85px 220px 85px minmax(0, 1fr);

  min-height: 95px;
  padding: 0;
  gap: 0;
}

  gap: 18px;

  font-weight: 800;
}

.team.home {

  text-align: right;
}

.team.away {

  text-align: left;
}

 .team.home,

  min-width: 0;

  align-items: center;
  justify-content: center;
  background: #080808;
  color: #fff;
  font-size: 58px;
  font-weight: 900;
  line-height: 1;
  min-width: 0;
}

.home-score-panel span,
.away-score-panel span {

}

.center {
  background: rgba(190, 160, 235, 0.96);
}

.crest {

.penalty-score {

.controls {

.status {

  .team.home,
.team.away {

  gap: 4px;

.crest {

  font-size: 12px;
}

.fouls {

}


/* =========================
   ANIMACIÓN DE GOL
========================= */

.goal-animation {
  --goal-primary: #222222;
  --goal-secondary: #555555;
  position: absolute;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  isolation: isolate;
  pointer-events: none;
  background: linear-gradient(
    115deg,
    var(--goal-primary) 0%,
    var(--goal-primary) 48%,
    var(--goal-secondary) 48%,
    var(--goal-secondary) 100%
  );
}

.goal-animation.active {
  display: flex;
  animation: goalScreen 3.2s ease both;
}

.goal-animation::before {
  content: "";
  position: absolute;
  inset: -35%;
  z-index: 0;
  background: repeating-conic-gradient(
    from 0deg,
    rgba(255,255,255,0.20) 0deg 7deg,
    transparent 7deg 14deg
  );
  animation: goalRays 8s linear infinite;
}

.goal-animation::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at center, transparent 0 20%, rgba(0,0,0,0.20) 75%),
    linear-gradient(180deg, rgba(0,0,0,0.12), transparent 35%, rgba(0,0,0,0.30));
  z-index: 0;
}

.goal-animation-content {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr);
  grid-template-rows: 100%;
  align-items: center;
  justify-items: center;
  text-align: center;
  padding: 4px 10px;
  gap: 6px;
}

.goal-team-name {
  grid-column: 3;
  grid-row: 1;
  max-width: 100%;
  min-width: 0;
  color: #fff;
  font-size: clamp(10px, 2.5vw, 30px);
  line-height: 1.05;
  font-weight: 900;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  text-shadow: 0 4px 18px rgba(0,0,0,0.55);
  animation: goalTeamName 3.2s ease both;
}

.goal-crest-stage {
  grid-column: 2;
  grid-row: 1;
  width: 100%;
  height: 100%;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  overflow: hidden;
  animation: goalCrestZoom 3.2s cubic-bezier(.15,.75,.2,1) both;
}

.goal-crest-stage img {
  display: block;
  width: 175%;
  height: 175%;
  max-width: none;
  max-height: none;
  object-fit: contain;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,0.48));
}

.goal-crest-fallback {
  display: none;
  color: #fff;
  font-size: clamp(34px, 7vw, 90px);
  line-height: 1;
  filter: drop-shadow(0 12px 28px rgba(0,0,0,0.48));
}

.goal-word {
  grid-column: 1;
  grid-row: 1;
  justify-self: center;
  color: #fff;
  font-size: clamp(20px, 5vw, 64px);
  line-height: 0.9;
  font-weight: 1000;
  font-style: italic;
  letter-spacing: -0.055em;
  -webkit-text-stroke: 2px rgba(0,0,0,0.22);
  text-shadow:
    0 7px 0 rgba(0,0,0,0.20),
    0 12px 35px rgba(0,0,0,0.45);
  animation: goalWordPop 3.2s cubic-bezier(.16,.8,.25,1) both;
}

@keyframes goalScreen {
  0% { opacity: 0; }
  8% { opacity: 1; }
  78% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes goalRays {
  from { transform: rotate(0deg) scale(1); }
  to { transform: rotate(360deg) scale(1); }
}

@keyframes goalTeamName {
  0%, 5% { opacity: 0; transform: translateX(24px); }
  16%, 78% { opacity: 1; transform: translateX(0); }
  100% { opacity: 0; transform: translateX(12px); }
}

@keyframes goalCrestZoom {
  0% { opacity: 0; transform: scale(0.12) rotate(-16deg); }
  18% { opacity: 1; transform: scale(1.18) rotate(5deg); }
  34%, 78% { opacity: 1; transform: scale(1) rotate(0deg); }
  100% { opacity: 0; transform: scale(1.18) rotate(4deg); }
}

@keyframes goalWordPop {
  0%, 20% { opacity: 0; transform: scale(0.35) translateX(-25px); }
  38% { opacity: 1; transform: scale(1.12) translateX(0); }
  48%, 78% { opacity: 1; transform: scale(1) translateX(0); }
  100% { opacity: 0; transform: scale(1.18) translateX(-10px); }
}

@media (prefers-reduced-motion: reduce) {
  .goal-animation::before {
    animation: none;
  }
}


/* =========================
   PRESENTACIÓN Y ZÓCALO
========================= */
.broadcast-stack {
  position: absolute;
  z-index: 30;
  top: 36vh;
  right: 18vw;
  width: min(70vw, 900px);
  display: flex;
  flex-direction: column;
  gap: 14px;
  pointer-events: none;
}
.presentation-card, .announcement-bar {
  opacity: 0;
  visibility: hidden;
  transform: translateX(28px);
  transition: opacity .35s ease, transform .35s ease, visibility .35s;
  pointer-events: none;
}
.presentation-card {
  width: 100%;
  padding: 16px 18px 10px;
  border-radius: 13px;
  color: #fff;
  background: linear-gradient(145deg, rgba(24,24,29,.97), rgba(5,5,8,.96));
  border: 1px solid rgba(255,255,255,.22);
  box-shadow: 0 8px 28px rgba(0,0,0,.38);
  text-align: center;
}
.presentation-card.active, .announcement-bar.active {
  opacity: 1; visibility: visible; transform: translateX(0);
}
#scoreboard.presentation-hidden {
  opacity: 0; visibility: hidden; transform: translateY(-8px);
  transition: opacity .3s ease, transform .3s ease, visibility .3s;
}
.scoreboard { transition: opacity .3s ease, transform .3s ease, visibility .3s; }
.presentation-title { font-size: clamp(14px, 1.35vw, 20px); font-weight: 900; letter-spacing: 1.1px; line-height: 1.15; }
.presentation-subtitle { margin-top: 5px; font-size: clamp(10px, .9vw, 13px); font-weight: 700; color: rgba(255,255,255,.76); letter-spacing: .45px; }
.presentation-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: 14px; }
.presentation-team { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.presentation-crest { width: clamp(62px, 6.2vw, 88px); height: clamp(62px, 6.2vw, 88px); display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 12px; background: rgba(255,255,255,.12); }
.presentation-crest img { width: 100%; height: 100%; object-fit: contain; }
.presentation-team-name { font-size: clamp(11px, 1vw, 15px); font-weight: 900; line-height: 1.1; overflow-wrap: anywhere; }
.presentation-result { min-width: 100px; text-align: center; }
.presentation-score { font-size: clamp(28px, 3vw, 42px); font-weight: 1000; line-height: 1; white-space: nowrap; }
.presentation-first-leg { margin-top: 5px; font-size: 11px; color: rgba(255,255,255,.72); }
.presentation-phase { margin-top: 5px; font-size: 12px; font-weight: 900; letter-spacing: 1px; }
.presentation-brand { display: block; width: min(165px, 34%); max-height: 52px; object-fit: contain; margin: 12px auto 0; }
.announcement-bar { width: 100%; min-height: 82px; padding: 10px 14px; display: grid; grid-template-columns: 62px minmax(0,1fr) 58px; align-items: center; gap: 12px; border-radius: 12px; color: #fff; background: var(--announcement-color, #242424); box-shadow: 0 7px 24px rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.25); }
.announcement-crest, .announcement-brand { width: 58px; height: 58px; border-radius: 50%; object-fit: contain; display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgba(255,255,255,.14); }
.announcement-crest img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
.announcement-text { text-align: center; font-size: clamp(13px, 1.35vw, 19px); font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; }
@media (max-width: 900px) {
  .broadcast-stack { width: min(70vw, 900px); right: 18vw; top: 34vh; }
  .announcement-bar { grid-template-columns: 48px minmax(0,1fr) 46px; min-height: 66px; padding: 8px 10px; gap: 8px; }
  .announcement-crest, .announcement-brand { width: 44px; height: 44px; }
}
@media (prefers-reduced-motion: reduce) { .presentation-card, .announcement-bar, #scoreboard { transition: none; } }

</style>
</head>

const homeNameElement =
  document.getElementById("homeName");

const awayNameElement =
  document.getElementById("awayName");

const homeCrestElement =
  document.getElementById("homeCrest");

const awayCrestElement =
  document.getElementById("awayCrest");

const goalAnimationElement =
  document.getElementById("goalAnimation");

const goalTeamNameElement =
  document.getElementById("goalTeamName");

const goalCrestImageElement =
  document.getElementById("goalCrestImage");

const goalCrestFallbackElement =
  document.getElementById("goalCrestFallback");

const scoreboardElement = document.getElementById("scoreboard");
const presentationCardElement = document.getElementById("presentationCard");
const announcementBarElement = document.getElementById("announcementBar");
const presentationTitleDisplay = document.getElementById("presentationTitleDisplay");
const presentationSubtitleDisplay = document.getElementById("presentationSubtitleDisplay");
const presentationHomeCrest = document.getElementById("presentationHomeCrest");
const presentationAwayCrest = document.getElementById("presentationAwayCrest");
const presentationHomeName = document.getElementById("presentationHomeName");
const presentationAwayName = document.getElementById("presentationAwayName");
const presentationScore = document.getElementById("presentationScore");
const presentationFirstLeg = document.getElementById("presentationFirstLeg");
const presentationPhase = document.getElementById("presentationPhase");
const announcementCrest = document.getElementById("announcementCrest");
const announcementTextDisplay = document.getElementById("announcementTextDisplay");

let scoreSnapshotInitialized = false;
let goalAnimationTimeout = null;

function showGoalAnimation(team, teamName, primaryColor, secondaryColor, crestUrl) {
  const safePrimary = primaryColor || "#222222";
  const safeSecondary = secondaryColor || "#555555";

  goalAnimationElement.style.setProperty("--goal-primary", safePrimary);
  goalAnimationElement.style.setProperty("--goal-secondary", safeSecondary);

  goalTeamNameElement.textContent = teamName || (team === "home" ? "EQUIPO LOCAL" : "EQUIPO VISITANTE");

  if (crestUrl) {
    goalCrestImageElement.src = crestUrl;
    goalCrestImageElement.style.display = "block";
    goalCrestFallbackElement.style.display = "none";
  } else {
    goalCrestImageElement.removeAttribute("src");
    goalCrestImageElement.style.display = "none";
    goalCrestFallbackElement.style.display = "block";
  }

  if (goalAnimationTimeout !== null) {
    clearTimeout(goalAnimationTimeout);
  }

  goalAnimationElement.classList.remove("active");
  void goalAnimationElement.offsetWidth;
  goalAnimationElement.classList.add("active");

  goalAnimationTimeout = setTimeout(function() {
    goalAnimationElement.classList.remove("active");
    goalAnimationTimeout = null;
  }, 3300);
}


/* =========================
   RELOJ
========================= */

function getCurrentSeconds() {

  if (!running || !clockStartedAt) {
    return seconds;
  }


  const elapsed =
    Math.floor(
      (Date.now() - clockStartedAt) / 1000
    );


  if (gameMode === "futsal") {

    return Math.max(
      0,
      seconds - Math.max(0, elapsed)
    );

  }


  return seconds + Math.max(0, elapsed);
}


function updateClock() {

  const currentSeconds =
    getCurrentSeconds();


  if (
    gameMode === "futsal" &&
    running &&
    currentSeconds <= 0
  ) {

    seconds = 0;

    running = false;

    clockStartedAt = null;

    stopLocalTimer();

  }


  const displaySeconds =
    Math.max(0, currentSeconds);


  const minutes =
    Math.floor(displaySeconds / 60);

  const secs =
    displaySeconds % 60;


  clockElement.textContent =
    String(minutes).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");
}


/* =========================
   PANTALLA
========================= */

function countPenaltyGoals(results) {
  return results.filter(function(result) {
    return result === "goal";
  }).length;
}

function penaltySymbol(result) {
  return result === "goal" ? "●" : "X";
}

function resultsToText(results) {
  if (!results || results.length === 0) return "—";

  return results.map(penaltySymbol).join(" ");
}
  
  function setPresentationCrest(element, url, color) {
    const crestBackground = /^#[0-9a-f]{6}$/i.test(color || "") ? color + "88" : (color || "rgba(255,255,255,.12)");
    element.style.backgroundColor = crestBackground;
    element.innerHTML = "";
    if (url) {
      const image = document.createElement("img");
      image.src = url; image.alt = "Escudo";
      element.appendChild(image);
    }
  }

  function updateBroadcastGraphics(data) {
    presentationTitleDisplay.textContent = presentationTitle || "";
    presentationSubtitleDisplay.textContent = presentationSubtitle || "";
    presentationHomeName.textContent = homeNameElement.textContent || "LOCAL";
    presentationAwayName.textContent = awayNameElement.textContent || "VISITANTE";
    setPresentationCrest(presentationHomeCrest, data.homeCrest || "", data.homePrimaryColor);
    setPresentationCrest(presentationAwayCrest, data.awayCrest || "", data.awayPrimaryColor);
    presentationScore.textContent = home + " - " + away;
    presentationFirstLeg.textContent = data.showFirstLeg ? "IDA: " + (data.firstLegHomeScore ?? 0) + " - " + (data.firstLegAwayScore ?? 0) : "";
    presentationFirstLeg.style.display = data.showFirstLeg ? "block" : "none";
    presentationPhase.textContent = currentPeriod === "ENTRETIEMPO" ? "ENTRETIEMPO" : currentPeriod === "FINAL" ? "FINAL" : currentPeriod;
    scoreboardElement.classList.toggle("presentation-hidden", presentationVisible);
    presentationCardElement.classList.toggle("active", presentationVisible);
    presentationCardElement.setAttribute("aria-hidden", String(!presentationVisible));
    announcementTextDisplay.textContent = announcementText || "";
    announcementCrest.innerHTML = "";
    if (announcementTeamCrest) {
      const image = document.createElement("img"); image.src = announcementTeamCrest; image.alt = "Escudo del anuncio"; announcementCrest.appendChild(image);
    }
    announcementBarElement.style.setProperty("--announcement-color", announcementTeamColor || "#222222");
    announcementBarElement.classList.toggle("active", announcementVisible);
    announcementBarElement.setAttribute("aria-hidden", String(!announcementVisible));
  }

  function updateScreen() {

    leagueElement.textContent =
  gameMode === "futsal"
    ? "SUEÑOS EN JUEGO"
    : "LIGA UNIVERSITARIA";

  homeScoreElement.textContent =
    home;

  awayScoreElement.textContent =
    away;

  firstLegScoreElement.textContent =
  firstLegHomeScore + " - " + firstLegAwayScore;

if (showFirstLeg) {

  firstLegElement.style.display =
    "flex";

} else {

  firstLegElement.style.display =
    "none";
}

  penaltyHomeScoreElement.textContent =
  countPenaltyGoals(penaltyHomeResults);

penaltyAwayScoreElement.textContent =
  countPenaltyGoals(penaltyAwayResults);

penaltyHomeResultsElement.textContent =
  resultsToText(penaltyHomeResults);

penaltyAwayResultsElement.textContent =
  resultsToText(penaltyAwayResults);

if (showPenalties) {
  penaltiesElement.style.display = "grid";
} else {
  penaltiesElement.style.display = "none";
}

  homeFoulsElement.textContent =
    "FALTAS: " + homeFouls;

  awayFoulsElement.textContent =
    "FALTAS: " + awayFouls;

  /*
    Las faltas solamente se muestran
    cuando la modalidad es Futsal.
  */

  if (gameMode === "futsal") {

    homeFoulsElement.style.display =
      "block";

    awayFoulsElement.style.display =
      "block";

  } else {

    homeFoulsElement.style.display =
      "none";

    awayFoulsElement.style.display =
      "none";
  }


  updateClock();


  if (currentPeriod === "ENTRETIEMPO") {

    clockElement.style.display =
      "none";

    periodElement.style.display =
      "none";

    halftimeElement.textContent =
      "ENTRETIEMPO";

    halftimeElement.style.display =
      "block";

  } else if (currentPeriod === "FINAL") {

    clockElement.style.display =
      "none";

    periodElement.style.display =
      "none";

    halftimeElement.textContent =
      "FINAL";

    halftimeElement.style.display =
      "block";

  } else {

    clockElement.style.display =
      "block";

    periodElement.style.display =
      "block";

    halftimeElement.style.display =
      "none";

    periodElement.textContent =
      currentPeriod;
  }


  if (gameMode === "futsal") {
  addedTimeElement.style.display = "none";
} else {
  addedTimeElement.style.display = "block";

  if (addedTime !== null) {
    addedTimeElement.textContent = "+" + addedTime + " adicional";
  } else {
    addedTimeElement.textContent = "";
  }
}


  updateBroadcastGraphics(window.currentMatchData || {});
}


/* =========================
   TIMER LOCAL
========================= */

function stopLocalTimer() {

  if (timer !== null) {

    clearInterval(timer);

    timer = null;
  }
}


function startLocalTimer() {

  stopLocalTimer();

  if (!running || !clockStartedAt) {
    return;
  }

  timer =
    setInterval(function() {

      updateClock();

    }, 250);
}


/* =========================
   GUARDAR ESTADO
========================= */

function saveState(extraData) {

  const baseData = {

    league:
      leagueElement.textContent,

    homeName:
      homeNameElement.textContent,

    awayName:
      awayNameElement.textContent,

    homeCrest:
      homeCrestElement.textContent,

    awayCrest:
      awayCrestElement.textContent,

    homeScore:
      home,

    awayScore:
      away,

    homeFouls:
      homeFouls,

    awayFouls:
      awayFouls,

    seconds:
      seconds,

    gameMode:
      gameMode,

    running:
      running,

    period:
      currentPeriod,

    addedTime:
      addedTime,

    clockStartedAt:
      clockStartedAt
  };


  if (extraData) {

    Object.assign(
      baseData,
      extraData
    );
  }


  return matchRef.update(
    baseData
  );
}


/* =========================
   GOLES
========================= */

function homeGoal() {

  if (loadingFirebase) {
    return;
  }

  matchRef
    .child("homeScore")
    .transaction(function(currentValue) {

      return (currentValue || 0) + 1;

    });
}


function awayGoal() {

  if (loadingFirebase) {
    return;
  }

  matchRef
    .child("awayScore")
    .transaction(function(currentValue) {

      return (currentValue || 0) + 1;

    });
}


/* =========================
   INICIAR RELOJ
========================= */

function startClock() {

  if (loadingFirebase) {
    return;
  }

  if (running) {
    return;
  }

  if (
    currentPeriod === "ENTRETIEMPO" ||
    currentPeriod === "FINAL"
  ) {
    return;
  }


  running = true;

  clockStartedAt =
    Date.now();


  updateScreen();

  startLocalTimer();


  matchRef.update({

    running:
      true,

    seconds:
      seconds,

    gameMode:
      gameMode,

    clockStartedAt:
      firebase.database.ServerValue.TIMESTAMP

  });
}


/* =========================
   PAUSAR RELOJ
========================= */

function pauseClock() {

  if (loadingFirebase) {
    return;
  }


  if (!running) {
    return;
  }


  seconds =
    getCurrentSeconds();

  running = false;

  clockStartedAt = null;


  stopLocalTimer();

  updateScreen();


  matchRef.update({

    seconds:
      seconds,

    running:
      false,

    clockStartedAt:
      null

  });
}


/* =========================
   FINALIZAR PRIMER TIEMPO
========================= */

function finishFirstHalf() {

  if (loadingFirebase) {
    return;
  }


  if (running) {

    seconds =
      getCurrentSeconds();
  }


  running = false;

  clockStartedAt = null;

  stopLocalTimer();


  currentPeriod =
    "ENTRETIEMPO";


  updateScreen();


  matchRef.update({

    seconds:
      seconds,

    running:
      false,

    clockStartedAt:
      null,

    period:
      "ENTRETIEMPO"

  });
}


/* =========================
   INICIAR SEGUNDO TIEMPO
========================= */

function startSecondHalf() {

  if (loadingFirebase) {
    return;
  }


  stopLocalTimer();


  if (gameMode === "futsal") {

    seconds =
      20 * 60;

  } else {

    seconds =
      45 * 60;
  }


  currentPeriod =
    "2T";

  addedTime =
    null;

  running =
    true;

  clockStartedAt =
    Date.now();


  updateScreen();

  startLocalTimer();


  matchRef.update({

    seconds:
      seconds,

    gameMode:
      gameMode,

    period:
      "2T",

    addedTime:
      null,

    running:
      true,

    clockStartedAt:
      firebase.database.ServerValue.TIMESTAMP

  });
}


/* =========================
   FINALIZAR PARTIDO
========================= */

function finishMatch() {

  if (loadingFirebase) {
    return;
  }


  if (running) {

    seconds =
      getCurrentSeconds();
  }


  running = false;

  clockStartedAt = null;

  stopLocalTimer();


  currentPeriod =
    "FINAL";


  updateScreen();


  matchRef.update({

    seconds:
      seconds,

    running:
      false,

    clockStartedAt:
      null,

    period:
      "FINAL"

  });
}


/* =========================
   TIEMPO ADICIONAL
========================= */

function showAddedTime(minutes) {

  if (loadingFirebase) {
    return;
  }


  addedTime =
    minutes;


  updateScreen();


  matchRef.update({

    addedTime:
      minutes

  });
}


function hideAddedTime() {

  if (loadingFirebase) {
    return;
  }


  addedTime =
    null;


  updateScreen();


  matchRef.update({

    addedTime:
      null

  });
}


/* =========================
   REINICIAR
========================= */

function resetMatch() {

  if (loadingFirebase) {
    return;
  }


  stopLocalTimer();


  home = 0;

  away = 0;

  homeFouls = 0;

  awayFouls = 0;

  seconds = 0;

  running = false;

  currentPeriod = "1T";

  addedTime = null;

  clockStartedAt = null;


  updateScreen();


  matchRef.update({

    homeScore:
      0,

    awayScore:
      0,

    homeFouls:
      0,

    awayFouls:
      0,

    seconds:
      0,

    running:
      false,

    period:
      "1T",

    addedTime:
      null,

    clockStartedAt:
      null,

    gameMode:
      gameMode

  });
}


/* =========================
   CONEXIÓN FIREBASE
========================= */

auth.signInAnonymously()

  .then(function() {

    statusElement.textContent =
      "Firebase conectado · Partido " +
      partidoNumero;


    matchRef.on(
      "value",
      function(snapshot) {

        const data =
          snapshot.val();


        if (!data) {

          loadingFirebase =
            false;


          saveState();

          return;
        }


        const incomingHomeScore = data.homeScore ?? 0;
        const incomingAwayScore = data.awayScore ?? 0;

        // La primera lectura de Firebase solo sincroniza el marcador.
        // Las animaciones se disparan únicamente ante un aumento posterior.
        if (scoreSnapshotInitialized) {
          if (incomingHomeScore > home) {
            const homeCrestUrl =
              data.homeCrest ||
              (homeCrestElement.querySelector("img") && homeCrestElement.querySelector("img").src);

            showGoalAnimation(
              "home",
              data.homeName || homeNameElement.textContent,
              data.homePrimaryColor,
              data.homeSecondaryColor,
              homeCrestUrl
            );
          } else if (incomingAwayScore > away) {
            const awayCrestUrl =
              data.awayCrest ||
              (awayCrestElement.querySelector("img") && awayCrestElement.querySelector("img").src);

            showGoalAnimation(
              "away",
              data.awayName || awayNameElement.textContent,
              data.awayPrimaryColor,
              data.awaySecondaryColor,
              awayCrestUrl
            );
          }
        }

        window.currentMatchData = data;
        presentationVisible = data.presentationVisible === true;
        announcementVisible = data.announcementVisible === true;
        presentationTitle = data.presentationTitle || "";
        presentationSubtitle = data.presentationSubtitle || "";
        announcementText = data.announcementText || "";
        announcementTeamCrest = data.announcementTeamCrest || "";
        announcementTeamColor = data.announcementTeamColor || "#222222";

        home = incomingHomeScore;
        away = incomingAwayScore;
        scoreSnapshotInitialized = true;

        homeFouls =
          data.homeFouls ?? 0;

        awayFouls =
          data.awayFouls ?? 0;

        firstLegHomeScore =
  data.firstLegHomeScore ?? 0;

firstLegAwayScore =
  data.firstLegAwayScore ?? 0;

showFirstLeg =
  data.showFirstLeg ?? false;

        penaltyHomeResults =
  Array.isArray(data.penaltyHomeResults)
    ? data.penaltyHomeResults
    : [];

penaltyAwayResults =
  Array.isArray(data.penaltyAwayResults)
    ? data.penaltyAwayResults
    : [];

showPenalties =
  data.showPenalties ?? false;

        seconds =
          data.seconds ?? 0;

        gameMode =
          data.gameMode ?? "futbol";

        running =
          data.running ?? false;

        currentPeriod =
          data.period ?? "1T";

        addedTime =
          data.addedTime ?? null;

        clockStartedAt =
          data.clockStartedAt ?? null;


        if (data.league) {

          leagueElement.textContent =
            data.league;
        }


        if (data.homeName) {

          homeNameElement.textContent =
            data.homeName;
        }

        if (data.homePrimaryColor) {
  document.querySelector(".team.home").style.backgroundColor =
    data.homePrimaryColor;
}

if (data.homeSecondaryColor) {
  homeCrestElement.style.backgroundColor =
    data.homeSecondaryColor;
  homeCrestElement.style.borderColor =
    data.homeSecondaryColor;
}

        if (data.awayName) {

          awayNameElement.textContent =
            data.awayName;
        }

          if (data.awayName) {

          awayNameElement.textContent =
            data.awayName;
        }

        if (data.awayPrimaryColor) {
  document.querySelector(".team.away").style.backgroundColor =
    data.awayPrimaryColor;
}

if (data.awaySecondaryColor) {
  awayCrestElement.style.backgroundColor =
    data.awaySecondaryColor;
  awayCrestElement.style.borderColor =
    data.awaySecondaryColor;
}

       if (data.homeCrest) {
  homeCrestElement.innerHTML = "";

  const img = document.createElement("img");
  img.src = data.homeCrest;
  img.alt = "Escudo local";

  img.style.width = "100%";
  img.style.height = "100%";
  img.style.objectFit = "contain";
  img.style.borderRadius = "50%";

  homeCrestElement.appendChild(img);
}

       if (data.awayCrest) {
  awayCrestElement.innerHTML = "";

  const img = document.createElement("img");
  img.src = data.awayCrest;
  img.alt = "Escudo visitante";

  img.style.width = "100%";
  img.style.height = "100%";
  img.style.objectFit = "contain";
  img.style.borderRadius = "50%";

  awayCrestElement.appendChild(img);
}

        updateScreen();


        loadingFirebase =
          false;


        if (running) {

          startLocalTimer();

        } else {

          stopLocalTimer();

        }

      }
    );

  })


  .catch(function(error) {

    console.error(error);


    statusElement.textContent =
      "Error al conectar con Firebase";

  });


/* =========================
   INICIO
========================= */

updateScreen();


/* =========================
   BOTONES HTML
========================= */

window.homeGoal =
  homeGoal;

window.awayGoal =
  awayGoal;

window.startClock =
  startClock;

window.pauseClock =
  pauseClock;

window.finishFirstHalf =
  finishFirstHalf;

window.startSecondHalf =
  startSecondHalf;

window.finishMatch =
  finishMatch;

window.showAddedTime =
  showAddedTime;

window.hideAddedTime =
  hideAddedTime;

window.resetMatch =
  resetMatch;

</script>

</body>
</html>
