<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcador Liga Universitaria</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
}

.scoreboard {
  width: 1100px;
  max-width: 96vw;
  margin: 30px auto;
  background: rgba(10, 10, 10, 0.94);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.35);
}

.league {
  background: #111;
  padding: 8px 20px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 1px;
}

.match {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 25px;
  gap: 35px;
}

.team {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 15px;
  font-size: 24px;
  font-weight: bold;
}

.team.home {
  justify-content: flex-end;
  text-align: right;
}

.team.away {
  justify-content: flex-start;
  text-align: left;
}

.crest {
  width: 58px;
  height: 58px;
  min-width: 58px;
  border-radius: 50%;
  background: #555;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: bold;
}

.score {
  font-size: 48px;
  font-weight: bold;
  min-width: 45px;
  text-align: center;
}

.center {
  min-width: 130px;
  text-align: center;
}

.clock {
  font-size: 30px;
  font-weight: bold;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.period {
  font-size: 17px;
  margin-top: 3px;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.period.hidden,
.clock.hidden {
  opacity: 0;
  transform: translateY(-5px);
}

.halftime {
  font-size: 20px;
  font-weight: bold;
  opacity: 0;
  transform: translateY(5px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  position: absolute;
  width: 130px;
  margin-top: -22px;
}

.halftime.visible {
  opacity: 1;
  transform: translateY(0);
}

.added-time {
  font-size: 14px;
  font-weight: bold;
  margin-top: 2px;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.added-time.visible {
  opacity: 1;
  transform: translateY(0);
}

.controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 10px;
  background: rgba(255,255,255,0.08);
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 6px;
  padding: 8px 13px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: 0.85;
}

@media (max-width: 700px) {

  .scoreboard {
    width: 96vw;
  }

  .match {
    gap: 10px;
    padding: 12px;
  }

  .team {
    font-size: 15px;
    gap: 7px;
  }

  .crest {
    width: 42px;
    height: 42px;
    min-width: 42px;
  }

  .score {
    font-size: 34px;
    min-width: 32px;
  }

  .center {
    min-width: 70px;
  }

  .clock {
    font-size: 22px;
  }

  .period {
    font-size: 14px;
  }

  .halftime {
    width: 70px;
    font-size: 14px;
  }

  .added-time {
    font-size: 11px;
  }
}

</style>
</head>

<body>

<div class="scoreboard">

  <div class="league">
    LIGA UNIVERSITARIA
  </div>

  <div class="match">

    <div class="team home">

      <div>
        EQUIPO LOCAL
      </div>

      <div class="crest">
        A
      </div>

      <div id="homeScore" class="score">
        0
      </div>

    </div>


    <div class="center">

      <div id="clock" class="clock">
        00:00
      </div>

      <div id="period" class="period">
        1T
      </div>

      <div id="halftime" class="halftime">
        ENTRETIEMPO
      </div>

      <div id="addedTime" class="added-time">
      </div>

    </div>


    <div class="team away">

      <div class="score" id="awayScore">
        0
      </div>

      <div class="crest">
        B
      </div>

      <div>
        EQUIPO VISITANTE
      </div>

    </div>

  </div>


  <div class="controls">

    <button onclick="homeGoal()">
      + Local
    </button>

    <button onclick="awayGoal()">
      + Visitante
    </button>

    <button onclick="startClock()">
      ▶ Iniciar
    </button>

    <button onclick="pauseClock()">
      ⏸ Pausar
    </button>

    <button onclick="finishFirstHalf()">
      Finalizar 1T
    </button>

    <button onclick="startSecondHalf()">
      Iniciar 2T
    </button>

    <button onclick="finishMatch()">
      Finalizar partido
    </button>

    <button onclick="showAddedTime(1)">
      +1
    </button>

    <button onclick="showAddedTime(2)">
      +2
    </button>

    <button onclick="showAddedTime(3)">
      +3
    </button>

    <button onclick="showAddedTime(4)">
      +4
    </button>

    <button onclick="showAddedTime(5)">
      +5
    </button>

    <button onclick="hideAddedTime()">
      Ocultar adicional
    </button>

    <button onclick="resetMatch()">
      ↺ Reiniciar
    </button>

  </div>

</div>


<script>

let home = 0;
let away = 0;

let seconds = 0;
let running = false;
let timer = null;

let currentPeriod = "1T";


function updateScore() {

  document.getElementById("homeScore").textContent = home;
  document.getElementById("awayScore").textContent = away;

}


function homeGoal() {

  home++;

  updateScore();

}


function awayGoal() {

  away++;

  updateScore();

}


function updateClock() {

  let minutes = Math.floor(seconds / 60);
  let secs = seconds % 60;

  document.getElementById("clock").textContent =
    String(minutes).padStart(2, "0") + ":" +
    String(secs).padStart(2, "0");

}


function startClock() {

  if (running) return;

  if (currentPeriod === "ENTRETIEMPO") return;

  if (currentPeriod === "FINAL") return;

  running = true;

  timer = setInterval(function() {

    seconds++;

    updateClock();

  }, 1000);

}


function pauseClock() {

  running = false;

  clearInterval(timer);

}


function finishFirstHalf() {

  pauseClock();

  currentPeriod = "ENTRETIEMPO";

  document.getElementById("clock").classList.add("hidden");
  document.getElementById("period").classList.add("hidden");

  setTimeout(function() {

    document.getElementById("halftime").classList.add("visible");

  }, 150);

}


function startSecondHalf() {

  pauseClock();

  currentPeriod = "2T";

  seconds = 45 * 60;

  document.getElementById("halftime").classList.remove("visible");

  setTimeout(function() {

    document.getElementById("clock").classList.remove("hidden");
    document.getElementById("period").classList.remove("hidden");

    document.getElementById("period").textContent = "2T";

    updateClock();

    startClock();

  }, 300);

}


function finishMatch() {

  pauseClock();

  currentPeriod = "FINAL";

  document.getElementById("clock").classList.add("hidden");
  document.getElementById("period").classList.add("hidden");

  document.getElementById("halftime").textContent = "FINAL";

  setTimeout(function() {

    document.getElementById("halftime").classList.add("visible");

  }, 150);

}


function showAddedTime(minutes) {

  document.getElementById("addedTime").textContent = "+" + minutes;

  document.getElementById("addedTime").classList.add("visible");

}


function hideAddedTime() {

  document.getElementById("addedTime").classList.remove("visible");

}


function resetMatch() {

  pauseClock();

  home = 0;
  away = 0;

  seconds = 0;

  currentPeriod = "1T";

  document.getElementById("period").textContent = "1T";

  document.getElementById("clock").classList.remove("hidden");
  document.getElementById("period").classList.remove("hidden");

  document.getElementById("halftime").classList.remove("visible");
  document.getElementById("halftime").textContent = "ENTRETIEMPO";

  hideAddedTime();

  updateScore();
  updateClock();

}


updateScore();
updateClock();

</script>

</body>
</html>
