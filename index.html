<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcador Liga Universitaria</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
}

.scoreboard {
  width: 900px;
  max-width: 95vw;
  margin: 30px auto;
  background: rgba(10, 10, 10, 0.92);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.35);
}

.league {
  background: #111;
  padding: 10px 20px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 1px;
}

.match {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 35px;
  padding: 20px;
}

.team {
  width: 250px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
}

.crest {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #555;
  margin: 0 auto 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.score {
  font-size: 55px;
  font-weight: bold;
}

.center {
  text-align: center;
}

.clock {
  font-size: 30px;
  font-weight: bold;
}

.period {
  font-size: 18px;
  margin-top: 4px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  background: rgba(255,255,255,0.08);
}

button {
  border: none;
  border-radius: 6px;
  padding: 9px 14px;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="scoreboard">

  <div class="league">
    LIGA UNIVERSITARIA
  </div>

  <div class="match">

    <div class="team">
      <div class="crest">A</div>
      EQUIPO LOCAL
      <div id="homeScore" class="score">0</div>
    </div>

    <div class="center">
      <div id="clock" class="clock">00:00</div>
      <div id="period" class="period">1T</div>
    </div>

    <div class="team">
      <div class="crest">B</div>
      EQUIPO VISITANTE
      <div id="awayScore" class="score">0</div>
    </div>

  </div>

  <div class="controls">
    <button onclick="homeGoal()">+ Local</button>
    <button onclick="awayGoal()">+ Visitante</button>
    <button onclick="startClock()">▶ Iniciar</button>
    <button onclick="pauseClock()">⏸ Pausar</button>
    <button onclick="resetClock()">↺ Reiniciar</button>
  </div>

</div>

<script>

let home = 0;
let away = 0;

let seconds = 0;
let running = false;
let timer = null;

function updateScore() {
  document.getElementById("homeScore").textContent = home;
  document.getElementById("awayScore").textContent = away;
}

function homeGoal() {
  home++;
  updateScore();
}

function awayGoal() {
  away++;
  updateScore();
}

function updateClock() {

  let minutes = Math.floor(seconds / 60);
  let secs = seconds % 60;

  document.getElementById("clock").textContent =
    String(minutes).padStart(2, "0") + ":" +
    String(secs).padStart(2, "0");
}

function startClock() {

  if (running) return;

  running = true;

  timer = setInterval(function() {
    seconds++;
    updateClock();
  }, 1000);
}

function pauseClock() {

  running = false;

  clearInterval(timer);
}

function resetClock() {

  running = false;

  clearInterval(timer);

  seconds = 0;

  updateClock();
}

</script>

</body>
</html>
